<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Galeria</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5f5;
    }

    h1 {
      text-align: center;
      padding: 30px 10px;
    }

    details {
      max-width: 1100px;
      margin: 15px auto;
      background: white;
      border-radius: 10px;
      padding: 10px 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    summary {
      cursor: pointer;
      font-size: 18px;
      font-weight: bold;
      padding: 10px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      padding: 10px;
    }

    .gallery img {
      width: 100%;
      height: 170px;
      object-fit: cover;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.2s;
    }

    .gallery img:hover {
      transform: scale(1.03);
    }

    /* LIGHTBOX */
    .lightbox {
      display: none;
      position: fixed;
      z-index: 999;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      justify-content: center;
      align-items: center;
    }

    .lightbox img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 10px;
    }

    .close {
      position: absolute;
      top: 20px;
      right: 30px;
      font-size: 40px;
      color: white;
      cursor: pointer;
    }
  </style>
</head>

<body>

<h1>Galeria nieruchomości</h1>

<!-- Z ZEWNĄTRZ -->
<details open>
  <summary>Z zewnątrz</summary>
  <div class="gallery">
    <img src="zew1.jpg" onclick="openLightbox(this)">
    <img src="zew2.jpg" onclick="openLightbox(this)">
  </div>
</details>

<!-- Parter -->
<details>
  <summary>Parter</summary>
  <div class="gallery">
    <img src="srodek1.jpg" onclick="openLightbox(this)">
    <img src="srodek2.jpg" onclick="openLightbox(this)">
  </div>
</details>

<!-- PIERWSZE PIĘTRO -->
<details>
  <summary>Pierwsze piętro</summary>
  <div class="gallery">
    <img src="p1_1.jpg" onclick="openLightbox(this)">
    <img src="p1_2.jpg" onclick="openLightbox(this)">
  </div>
</details>

<!-- DRUGIE PIĘTRO -->
<details>
  <summary>Drugie piętro</summary>
  <div class="gallery">
    <img src="p2_1.jpg" onclick="openLightbox(this)">
    <img src="p2_2.jpg" onclick="openLightbox(this)">
  </div>
</details>

<!-- Podwórko -->
<details>
  <summary>Podwórko</summary>
  <div class="gallery">
    <img src="p2_1.jpg" onclick="openLightbox(this)">
    <img src="p2_2.jpg" onclick="openLightbox(this)">
  </div>
</details>


<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <span class="close">&times;</span>
  <img id="lightbox-img">
</div>

<script>
  function openLightbox(img) {
    document.getElementById("lightbox").style.display = "flex";
    document.getElementById("lightbox-img").src = img.src;
  }

  function closeLightbox() {
    document.getElementById("lightbox").style.display = "none";
  }
</script>

</body>
</html>
